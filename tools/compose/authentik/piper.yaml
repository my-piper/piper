# Local single sign-on for Piper (compose profile `sso`). Applied by the
# Authentik worker at start; values match the OIDC_* block of
# backend/.env.template. Development only: fixed secret and passwords.
version: 1
metadata:
  name: Piper local SSO
entries:
  # Authentik's default email mapping says `email_verified: false`, and Piper
  # only creates accounts from verified emails. Users here are created by an
  # admin, so their emails are trusted.
  - model: authentik_providers_oauth2.scopemapping
    id: piper-email
    identifiers:
      name: "Piper: email (verified)"
    attrs:
      scope_name: email
      description: "Email address"
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True,
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: piper-provider
    identifiers:
      name: piper
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
      client_id: piper-local
      client_secret: piper-local-secret
      redirect_uris:
        - matching_mode: strict
          url: http://localhost/oauth/oidc/callback
          redirect_uri_type: authorization
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf piper-email
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    identifiers:
      slug: piper
    attrs:
      name: Piper
      provider: !KeyOf piper-provider

  # Test user: jane / piper-local-password
  - model: authentik_core.user
    identifiers:
      username: jane
    attrs:
      name: Jane Doe
      email: jane@example.com
      password: piper-local-password
