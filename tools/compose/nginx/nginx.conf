# Lets the "/" location pass WebSocket upgrades (Vite HMR of ng serve)
# without forcing "Connection: upgrade" on plain requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend {
    server host.docker.internal:4200;
}

upstream backend {
    server host.docker.internal:8081;
}

upstream sockets {
    server host.docker.internal:8082;
}

upstream oauth {
    server host.docker.internal:8083;
}

upstream nocodb {
    server host.docker.internal:8085;
}

upstream imgproxy {
    server imgproxy:8080;
}

server {
    listen 80 default_server;

    location /socket.io/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        proxy_pass http://sockets;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api {
        client_max_body_size 20m;
        proxy_pass http://backend;
    }

    location /oauth {
        rewrite ^/oauth/(.*)$ /$1 break;
        proxy_pass http://oauth;
    }

    location /nocodb {
        rewrite ^/nocodb/(.*)$ /$1 break;
        proxy_pass http://nocodb;
    }

    location /xyz/ {
        proxy_pass http://imgproxy;
    }

    # Public media only; the S3 anonymous identity cannot read package code.
    # Backend S3 requests use port 8333 directly to preserve signed paths.
    location /storage/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://seaweedfs:8333/;
    }

    location / {
        proxy_pass http://frontend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
