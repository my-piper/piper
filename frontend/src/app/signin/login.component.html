@if (!!error) {
  <app-informer [message]="error.message" (ok)="error = null"></app-informer>
}

<div class="app-container">
  <div class="frame">
    <ng-template #selectThemePopover>
      <app-select-theme></app-select-theme>
    </ng-template>
    <div class="frame-actions stack small">
      <button
        tuiIconButton
        appearance="outline-grayscale"
        size="s"
        class="round"
        iconStart="theme"
        aria-label="Theme"
        i18n-aria-label="@@label.theme"
        [appPopover]="{ content: selectThemePopover, trigger: 'click' }"
      ></button>
    </div>

    <div class="stack vertical align-center">
      <img width="60px" height="60px" src="assets/app-logo-square.svg?v=next" />
      <h1 i18n="@@label.login">Login</h1>
    </div>

    <form data-cy="form-login" [formGroup]="form" (ngSubmit)="login()">
      <fieldset>
        <tui-textfield
          tuiTextfieldSize="s"
          [tuiTextfieldCleaner]="false"
          [invalid]="
            form.controls.identity.touched && form.controls.identity.invalid
          "
        >
          <input
            tuiInput
            id="identity"
            name="identity"
            formControlName="identity"
            placeholder="User name or email"
            i18n-placeholder="@@label.login_or_email"
            data-cy="user-name"
            type="text"
          />
        </tui-textfield>
        <div class="vertical stack tiny align-stretch">
          <tui-textfield
            tuiTextfieldSize="s"
            [tuiTextfieldCleaner]="false"
            [invalid]="
              form.controls.password.touched && form.controls.password.invalid
            "
          >
            <input
              tuiInput
              id="password"
              name="password"
              formControlName="password"
              data-cy="password"
              placeholder="Password"
              i18n-placeholder="@@label.password"
              type="password"
            />
            <tui-icon tuiPassword />
          </tui-textfield>
          <p class="restore" i18n="@@message.your_can_restore_password">
            You can also
            <a [routerLink]="['/restore']">restore password</a>
          </p>
        </div>
      </fieldset>
      <footer>
        <button
          tuiButton
          appearance="outline-grayscale"
          size="s"
          class="fluid"
          [loading]="progress.login"
          [disabled]="progress.login"
          i18n="@@action.login"
          type="submit"
        >
          Login
        </button>
      </footer>
    </form>

    @if (config.ui.features | includes: "signup") {
      <div class="stack vertical align-center">
        <div class="stack small align-center">
          @if (config.ui.features | includes: "google_auth") {
            <a
              tuiIconButton
              appearance="outline-grayscale"
              size="s"
              class="round"
              href="/oauth/google"
            >
              <app-icon class="icon" icon="google"></app-icon>
            </a>
          }
          @if (config.ui.features | includes: "yandex_auth") {
            <a
              tuiIconButton
              appearance="outline-grayscale"
              size="s"
              class="round"
              href="/oauth/yandex"
            >
              <app-icon class="icon" icon="yandex"></app-icon>
            </a>
          }
        </div>
        <p i18n="@@message.no_account">
          Have no account yet?
          <a [routerLink]="['/signup']">Register</a>
        </p>
      </div>
    }
  </div>
</div>
