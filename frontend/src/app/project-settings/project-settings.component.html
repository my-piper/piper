@if (error) {
  <div tuiNotification appearance="negative" role="alert" class="error">
    <p>{{ error.message }}</p>
    @if (error.details?.length) {
      <ul>
        @for (message of error.details; track $index) {
          <li>{{ message }}</li>
        }
      </ul>
    }
    <p i18n="@@message.data_not_saved">Your data were not saved!</p>
    <button
      tuiButton
      appearance="flat"
      type="button"
      (click)="error = null"
      i18n="@@action.ok"
    >
      Ok
    </button>
  </div>
}

<form class="settings" [formGroup]="form" (ngSubmit)="save()">
  <tui-textfield
    tuiChevron
    [stringify]="folderLabel"
    [tuiTextfieldCleaner]="false"
  >
    <label tuiLabel for="project-folder" i18n="@@label.folder">Folder</label>
    <select
      tuiSelect
      id="project-folder"
      formControlName="group"
      [items]="folders"
    ></select>
  </tui-textfield>

  @if (form.controls.group.value === NEW_FOLDER) {
    <tui-textfield>
      <label tuiLabel for="project-new-folder" i18n="@@label.new_folder"
        >New folder</label
      >
      <input
        tuiInput
        id="project-new-folder"
        formControlName="newGroup"
        maxlength="100"
      />
    </tui-textfield>
  }

  <footer>
    <button
      tuiButton
      type="submit"
      [loading]="progress.saving"
      [disabled]="progress.saving || form.invalid"
      i18n="@@action.save"
    >
      Save
    </button>
  </footer>
</form>
