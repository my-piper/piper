<ng-template #errorTemplate>
  <div class="informer errors">
    <p>{{ error.message }}</p>
    <ul>
      <li *ngFor="let m of error?.details">{{ m }}</li>
    </ul>
    <p>Your data were not saved!</p>
    <div class="stack justify-center">
      <button class="primary" (click)="error = null">Ok</button>
    </div>
  </div>
</ng-template>

<app-informer
  *ngIf="!!error"
  [contentTemplate]="errorTemplate"
  (ok)="error = null"
></app-informer>

<form [formGroup]="form">
  <fieldset>
    <label for="project-group">Group</label>
    <select
      id="project-group"
      class="select-primary fluid"
      formControlName="group"
    >
      <option [ngValue]="null">No group</option>
      <option *ngFor="let g of groups" [ngValue]="g">{{ g }}</option>
      <option [ngValue]="NEW_GROUP">+ New group…</option>
    </select>
  </fieldset>
  <fieldset *ngIf="form.controls.group.value === NEW_GROUP">
    <label for="project-new-group">New group</label>
    <input
      id="project-new-group"
      class="input-primary fluid"
      type="text"
      formControlName="newGroup"
      placeholder="Group name"
      maxlength="100"
    />
  </fieldset>
  <footer>
    <button
      class="primary"
      type="button"
      [class.busy]="progress.saving"
      [disabled]="progress.saving || form.invalid"
      (click)="save()"
    >
      Save
    </button>
  </footer>
</form>
