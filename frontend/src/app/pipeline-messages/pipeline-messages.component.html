@if (messages.length > 0) {
  @for (m of messages; track $index) {
    <div>
      <header>
        @if (!!filter?.project) {
          <a target="_blank" [routerLink]="['/launches', m.launch]">
            {{ m.launch }}
          </a>
        }
        <small>{{ m.createdAt | date: "short" }}</small>
        @if (m.type; as type) {
          <label>{{ type }}</label>
        }
      </header>
      <div [innerHTML]="m.message | markdown | async"></div>
    </div>
  }
} @else {
  @if (progress.loading) {
    <div>
      <p>Loading...</p>
    </div>
  } @else {
    <p>No messages found.</p>
  }
}
