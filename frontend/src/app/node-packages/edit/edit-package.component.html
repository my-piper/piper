@if (error) {
  <div tuiNotification appearance="negative" role="alert" class="error-message">
    <p>{{ error.message }}</p>
    <button
      tuiButton
      appearance="flat"
      size="s"
      type="button"
      (click)="error = null"
      i18n="@@action.ok"
    >
      Ok
    </button>
  </div>
}

@if (!!nodePackage) {
  <h1>{{ nodePackage.title | i18n }}</h1>
}
<form [formGroup]="form">
  <fieldset>
    <app-json-editor
      [schema]="schema"
      [disable]="!!nodePackage ? ['root._id'] : []"
      [features]="[]"
      formControlName="nodePackage"
    ></app-json-editor>
  </fieldset>
  <footer>
    <button
      tuiButton
      size="m"
      type="button"
      [loading]="progress.saving"
      [disabled]="form.invalid || progress.saving"
      (click)="save()"
      i18n="@@action.save"
    >
      Save
    </button>
  </footer>
</form>
