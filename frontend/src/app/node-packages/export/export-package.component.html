@if (error) {
  <div tuiNotification appearance="negative" role="alert" class="error-message">
    <p>{{ error.message }}</p>
    <button
      tuiButton
      appearance="flat"
      type="button"
      (click)="error = null"
      i18n="@@action.ok"
    >
      Ok
    </button>
  </div>
}

@if (yaml) {
  <section class="nodes">
    <h2 i18n="@@label.nodes">Nodes</h2>
    <ul>
      @for (node of nodes; track node.id) {
        @let title = (node.title | i18n) || node.id;
        <li>
          {{ title }}
          @if (title !== node.id) {
            <code>({{ node.id }})</code>
          }
        </li>
      } @empty {
        <li i18n="@@message.no_nodes">No nodes</li>
      }
    </ul>
  </section>
}
<button
  tuiButton
  type="button"
  [copyToClipboard]="yaml"
  [disabled]="progress.loading || !yaml"
>
  <ng-container i18n="@@action.copy">Copy</ng-container>
</button>
<tui-loader [loading]="progress.loading" [overlay]="true">
  <ngx-monaco-editor
    class="editor"
    [options]="editorOptions"
    [formControl]="yamlControl"
  ></ngx-monaco-editor>
</tui-loader>
