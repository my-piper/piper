@if (error) {
  <div tuiNotification appearance="negative" role="alert" class="error-message">
    <p>{{ error.message }}</p>
    <button
      tuiButton
      appearance="flat"
      size="s"
      type="button"
      (click)="error = null"
      i18n="@@action.ok"
    >
      Ok
    </button>
  </div>
}

<h1>{{ nodePackage.title | i18n }}</h1>
<button
  tuiButton
  size="m"
  type="button"
  [copyToClipboard]="yaml"
  [disabled]="progress.loading || !yaml"
>
  <ng-container i18n="@@action.copy">Copy</ng-container>
</button>
<tui-loader [loading]="progress.loading" [overlay]="true">
  <pre>{{ yaml }}</pre>
</tui-loader>
