@if (error) {
  <div tuiNotification appearance="negative" role="alert" class="error-message">
    <p>{{ error.message }}</p>
    @if (error.details?.length) {
      <ul>
        @for (message of error.details; track $index) {
          <li>{{ message }}</li>
        }
      </ul>
    }
    <button
      tuiButton
      appearance="flat"
      size="s"
      type="button"
      (click)="error = null"
      i18n="@@action.ok"
    >
      Ok
    </button>
  </div>
}

<section class="archive">
  <h1 i18n="@@label.upload_package_archive">Upload package archive</h1>
  <p i18n="@@message.package_archive_hint">
    A zip with package.yaml and a folder per node holding schema.yaml and
    script.js.
  </p>
  <input
    #archiveInput
    type="file"
    accept=".zip,application/zip"
    hidden
    [disabled]="progress.uploading"
    (change)="upload($event)"
  />
  <button
    tuiButton
    size="m"
    type="button"
    iconStart="@tui.upload"
    [loading]="progress.uploading"
    [disabled]="progress.uploading"
    (click)="archiveInput.click()"
    i18n="@@action.choose_zip"
  >
    Choose zip
  </button>
</section>

<h1 i18n="@@label.put_yaml_or_url">Put YAML or URL</h1>
<form [formGroup]="form">
  <fieldset>
    <ngx-monaco-editor
      class="editor"
      formControlName="yaml"
      [options]="{
        language: 'yaml',
      }"
    >
    </ngx-monaco-editor>
  </fieldset>
  <footer>
    <button
      tuiButton
      size="m"
      type="button"
      [loading]="progress.importing"
      [disabled]="form.invalid || progress.importing"
      (click)="import()"
      i18n="@@action.import"
    >
      Import
    </button>
  </footer>
</form>
