<ng-template #errorTemplate>
  <div class="informer errors">
    <p>{{ error.message }}</p>
    <ul>
      @for (m of error?.details; track $index) {
        <li>{{ m }}</li>
      }
    </ul>
    <div class="stack justify-center">
      <button class="primary" (click)="error = null">Ok</button>
    </div>
  </div>
</ng-template>

@if (!!error) {
  <app-informer
    [contentTemplate]="errorTemplate"
    (ok)="error = null"
  ></app-informer>
}

<section class="archive">
  <h1 i18n="@@label.upload_package_archive">Upload package archive</h1>
  <p i18n="@@message.package_archive_hint">
    A zip with package.yaml and a folder per node holding schema.yaml and
    script.js.
  </p>
  <label class="button primary" [class.busy]="progress.uploading">
    <input
      type="file"
      accept=".zip,application/zip"
      [disabled]="progress.uploading"
      (change)="upload($event)"
    />
    <span i18n="@@action.choose_zip">Choose zip</span>
  </label>
</section>

<h1 i18n="@@label.put_yaml_or_url">Put YAML or URL</h1>
<form [formGroup]="form">
  <fieldset>
    <ngx-monaco-editor
      class="editor"
      formControlName="yaml"
      [options]="{
        language: 'yaml',
      }"
    >
    </ngx-monaco-editor>
  </fieldset>
  <footer>
    <button
      class="primary"
      type="button"
      [class.busy]="progress.importing"
      [disabled]="form.invalid || progress.importing"
      (click)="import()"
      i18n="@@action.import"
    >
      Import
    </button>
  </footer>
</form>
