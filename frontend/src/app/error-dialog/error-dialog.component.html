<!-- The dialog exists only while there is an error: Taiga's dialog needs the
     tui-root portal host as soon as it is created, and removing it closes
     the dialog. -->
@if (error(); as error) {
  <ng-template
    [tuiDialog]="true"
    [tuiDialogOptions]="{ size: 's' }"
    (tuiDialogChange)="!$event && closed.emit()"
  >
    <div class="error" role="alert">
      <p>{{ error.message }}</p>
      @if (details(error); as details) {
        @if (details.length > 0) {
          <ul>
            @for (detail of details; track $index) {
              <li>{{ detail }}</li>
            }
          </ul>
        }
      }
      <button
        tuiButton
        appearance="outline-grayscale"
        size="s"
        type="button"
        (click)="closed.emit()"
      >
        OK
      </button>
    </div>
  </ng-template>
}
