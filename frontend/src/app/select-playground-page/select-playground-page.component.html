<ng-template #toolsMenu>
  <tui-data-list>
    <button
      tuiOption
      type="button"
      [disabled]="progress.organizing"
      (click)="organize()"
    >
      <tui-icon icon="@tui.list-ordered" />
      <ng-container i18n="@@action.organize">Organize</ng-container>
    </button>
  </tui-data-list>
</ng-template>

<header class="stack align-center">
  <a class="circle" [routerLink]="['..']">
    <app-icon class="icon" [icon]="'chevron-left'"></app-icon>
  </a>
  <h1 i18n="@@label.select_app">Select app</h1>
  @if (userRole.admin | can | async) {
    <button
      tuiIconButton
      class="tools"
      appearance="flat"
      size="m"
      type="button"
      iconStart="@tui.ellipsis-vertical"
      aria-label="Actions"
      i18n-aria-label="@@label.actions"
      [tuiDropdown]="toolsMenu"
      [(tuiDropdownOpen)]="toolsOpen"
    ></button>
  }
</header>

<app-select-playground
  [tag]="tag"
  (selected)="go($event)"
></app-select-playground>
