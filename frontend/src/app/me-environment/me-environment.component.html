<app-informer
  *ngIf="!!error"
  [message]="error.message"
  (ok)="error = null"
></app-informer>

<div class="app-container">
  <h1 i18n="@@label.my_environment">My environment</h1>
  <p i18n="@@message.user_environment_explained">
    Variables here are shared by all your projects. A project uses them for
    every variable it leaves empty.
  </p>

  <form [formGroup]="form">
    <table class="default" *ngIf="variables.length > 0">
      <thead>
        <tr>
          <th i18n="@@label.name">Name</th>
          <th i18n="@@label.type">Type</th>
          <th i18n="@@label.value">Value</th>
          <th width="48px"></th>
        </tr>
      </thead>
      <tbody formArrayName="variables">
        <tr
          class="variable"
          *ngFor="let variable of variables.controls; let i = index"
          [formGroupName]="i"
        >
          <td title="Name" i18n-title="@@label.name">
            <input
              class="key input-primary fluid"
              [class.error]="variable.controls.key.invalid"
              formControlName="key"
              [readOnly]="variable.controls.stored.value"
              placeholder="API_KEY"
            />
          </td>
          <td title="Type" i18n-title="@@label.type">
            <select class="type select-primary" formControlName="type">
              <option value="string" i18n="@@label.string">String</option>
              <option value="number" i18n="@@label.number">Number</option>
              <option value="boolean" i18n="@@label.boolean">Boolean</option>
            </select>
          </td>
          <td title="Value" i18n-title="@@label.value">
            <input
              class="value input-primary fluid"
              [class.error]="variable.errors?.['valueType']"
              formControlName="value"
              [type]="
                variable.controls.type.value === 'string' ? 'password' : 'text'
              "
              [placeholder]="
                variable.controls.stored.value &&
                variable.controls.type.value === 'string'
                  ? storedPlaceholder
                  : ''
              "
            />
          </td>
          <td>
            <button
              type="button"
              class="remove transparent"
              [class.busy]="progress.removing[variable.controls.key.value]"
              [disabled]="progress.removing[variable.controls.key.value]"
              (click)="remove(i)"
              title="Remove"
              i18n-title="@@action.remove"
            >
              <app-icon class="icon" icon="delete" [size]="18"></app-icon>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <p *ngIf="variables.length === 0" i18n="@@message.no_user_variables">
      You have no variables yet.
    </p>

    <footer class="stack horizontal justify-between">
      <button type="button" class="primary with-icon" (click)="add()">
        <app-icon class="icon left" icon="add"></app-icon>
        <ng-container i18n="@@action.add_variable">Add variable</ng-container>
      </button>
      <button
        type="button"
        class="primary"
        [class.busy]="progress.saving"
        [disabled]="form.invalid || progress.saving"
        (click)="save()"
        i18n="@@action.save"
      >
        Save
      </button>
    </footer>
  </form>
</div>
