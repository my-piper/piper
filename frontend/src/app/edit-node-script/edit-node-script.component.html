@if (!!error) {
  <app-informer [message]="error.message" (ok)="error = null"></app-informer>
}

<form [formGroup]="form" [attr.aria-busy]="progress.loading">
  <fieldset>
    <div class="switcher">
      <label
        class="option"
        formControlName="execution"
        [appSelectable]="{ value: nodeExecution.rapid }"
        i18n="@@label.rapid"
      >
        Rapid
      </label>
      <label
        class="option"
        formControlName="execution"
        [appSelectable]="{ value: nodeExecution.regular }"
      >
        <span i18n="@@label.regular">Regular</span>
      </label>
      <label
        class="option"
        formControlName="execution"
        [appSelectable]="{ value: nodeExecution.deferred }"
      >
        <span i18n="@@label.deferred">Deferred</span>
      </label>
      <label
        class="option"
        formControlName="execution"
        [appSelectable]="{ value: nodeExecution.protracted }"
      >
        <span i18n="@@label.protracted">Protracted</span>
      </label>
    </div>
  </fieldset>
  <div class="editor">
    <ngx-monaco-editor
      class="monaco"
      formControlName="script"
      [options]="{
        language: 'javascript',
        minimap: { enabled: false },
        readOnly: !scriptLoaded || progress.saving || progress.formatting,
      }"
    >
    </ngx-monaco-editor>
  </div>
  <footer class="stack">
    <button
      tuiButton
      size="m"
      type="button"
      appearance="secondary"
      (click)="helpOpen = true"
      i18n="@@action.script_examples"
    >
      Examples
    </button>
    <button
      tuiButton
      size="m"
      type="button"
      [disabled]="!scriptLoaded || progress.saving || progress.formatting"
      [loading]="progress.formatting"
      (click)="format()"
      i18n="@@action.format"
    >
      Format
    </button>
    <button
      tuiButton
      size="m"
      type="button"
      [disabled]="!scriptLoaded || progress.saving || progress.formatting"
      [loading]="progress.saving"
      (click)="save()"
    >
      Save
    </button>
  </footer>
</form>

<ng-template [(tuiDialog)]="helpOpen" [tuiDialogOptions]="helpOptions">
  <app-node-script-help></app-node-script-help>
</ng-template>
