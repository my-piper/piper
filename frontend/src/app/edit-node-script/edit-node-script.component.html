<app-error-dialog [error]="error" (closed)="error = null" />

<form [formGroup]="form" [attr.aria-busy]="progress.loading">
  <fieldset>
    <tui-segmented>
      <label>
        <input
          formControlName="execution"
          type="radio"
          [value]="nodeExecution.rapid"
        />
        <span i18n="@@label.rapid">Rapid</span>
      </label>
      <label>
        <input
          formControlName="execution"
          type="radio"
          [value]="nodeExecution.regular"
        />
        <span i18n="@@label.regular">Regular</span>
      </label>
      <label>
        <input
          formControlName="execution"
          type="radio"
          [value]="nodeExecution.deferred"
        />
        <span i18n="@@label.deferred">Deferred</span>
      </label>
      <label>
        <input
          formControlName="execution"
          type="radio"
          [value]="nodeExecution.protracted"
        />
        <span i18n="@@label.protracted">Protracted</span>
      </label>
    </tui-segmented>
  </fieldset>
  <div class="editor">
    <ngx-monaco-editor
      class="monaco"
      formControlName="script"
      [options]="{
        language: 'javascript',
        minimap: { enabled: false },
        readOnly: !scriptLoaded || progress.saving || progress.formatting,
      }"
    >
    </ngx-monaco-editor>
  </div>
  <footer class="stack">
    <button
      tuiButton
      size="m"
      type="button"
      appearance="secondary"
      (click)="helpOpen = true"
      i18n="@@action.script_examples"
    >
      Examples
    </button>
    <button
      tuiButton
      size="m"
      type="button"
      [disabled]="!scriptLoaded || progress.saving || progress.formatting"
      [loading]="progress.formatting"
      (click)="format()"
      i18n="@@action.format"
    >
      Format
    </button>
    <button
      tuiButton
      size="m"
      type="button"
      [disabled]="!scriptLoaded || progress.saving || progress.formatting"
      [loading]="progress.saving"
      (click)="save()"
    >
      Save
    </button>
  </footer>
</form>

<ng-template [(tuiDialog)]="helpOpen" [tuiDialogOptions]="helpOptions">
  <app-node-script-help></app-node-script-help>
</ng-template>
