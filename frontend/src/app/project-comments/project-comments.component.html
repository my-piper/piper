<app-error-dialog [error]="error" (closed)="error = null" />

<form [formGroup]="form">
  <header>
    <p i18n="@@message.markdown_available">
      You can use
      <a target="_blank" href="https://www.markdownguide.org/basic-syntax/">
        markdown
      </a>
    </p>
  </header>
  <fieldset [disabled]="progress.adding">
    <tui-textfield
      [tuiTextfieldCleaner]="false"
      [invalid]="messageControl.touched && messageControl.invalid"
    >
      <textarea
        tuiTextarea
        formControlName="message"
        [minRows]="5"
        [maxRows]="5"
      ></textarea>
    </tui-textfield>
  </fieldset>
  <footer>
    <button
      tuiButton
      appearance="outline-grayscale"
      type="button"
      i18n="@@action.add_comment"
      [loading]="progress.adding"
      [disabled]="progress.adding"
      (click)="addComment()"
    >
      Add comment
    </button>
  </footer>
</form>

<div
  class="cards"
  [class.busy-block]="comments.length <= 0 && progress.loading"
>
  @for (c of comments; track c._id; let i = $index) {
    <div class="card">
      <header class="stack justify-end">
        <button
          tuiIconButton
          class="actions delete"
          appearance="secondary"
          type="button"
          iconStart="@tui.trash-2"
          aria-label="Delete"
          i18n-aria-label="@@action.delete"
          tuiHint="Delete"
          i18n-tuiHint="@@action.delete"
          [disabled]="progress.removing[i]"
          (click)="confirmRemove(c)"
        ></button>
        <div>{{ c.createdAt | date: "short" }}</div>
      </header>
      <article
        [innerHTML]="c.message | markdown: { safe: false } | async"
      ></article>
      <footer class="stack justify-between">
        <div class="created-by">{{ c.createdBy._id }}</div>
        <div>{{ c.createdAt | timePassed }}</div>
      </footer>
    </div>
  }
</div>

@if (chunk.length > 0 && !progress.loading) {
  <div
    waIntersectionObserver
    waIntersectionThreshold="0.5"
    (waIntersectionObservee)="$event[0]?.isIntersecting && loadMore()"
  ></div>
}
