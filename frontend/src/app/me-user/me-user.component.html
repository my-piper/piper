<ng-template #userMenu>
  <div class="panel stack vertical">
    @if (me.user$ | async; as user) {
      <div class="user">
        {{ user._id }}<br />
        <small>{{ user.email }}</small>
      </div>
    }

    <div [formGroup]="form" class="stack small align-center">
      <div class="checkbox small">
        <label class="switch">
          <input type="checkbox" formControlName="nsfw" />
          <span class="slider"></span>
        </label>
      </div>
      <small>NSFW</small>
    </div>
    <tui-data-list>
      <button tuiOption type="button" (click)="changePassword()">
        <tui-icon icon="@tui.key-round" />
        <ng-container i18n="@@action.change_password">
          Change password
        </ng-container>
      </button>
      <button tuiOption type="button" (click)="logout()">
        <tui-icon icon="@tui.log-out" />
        <ng-container i18n="@@action.logout">Logout</ng-container>
      </button>
    </tui-data-list>
  </div>
</ng-template>

<button
  tuiIconButton
  appearance="flat"
  size="s"
  type="button"
  iconStart="@tui.user"
  aria-label="Account"
  i18n-aria-label="@@label.account"
  [tuiDropdown]="userMenu"
  [(tuiDropdownOpen)]="menuOpen"
></button>
