<ul>
  @for (g of node.render.inputs; track g) {
    @if (g.group.group?.title; as group) {
      <h3>{{ group | i18n }}</h3>
    }
    @for (i of g.group.inputs; track i) {
      @if (!i.input.hidden) {
        <li [attr.data-type]="i.input.type" [class.filled]="!!inputs?.[i.id]">
          <b>{{ i.input.title | i18n }}</b>
          <app-io-value
            [io]="i.input"
            [value]="$safeNavigationMigration(inputs?.[i.id])"
          ></app-io-value>
        </li>
      }
    }
  }
</ul>
