<p i18n="@@message.project_environment_explained">
  Set the variables this pipeline's nodes read. A variable you leave empty is
  taken from <a [routerLink]="['/me', 'environment']">your environment</a>,
  shared by all your projects; greyed out variables can only be set there.
</p>

@if (variables.length > 0) {
  <form [formGroup]="form">
    <app-environment-variables
      [variables]="variables"
    ></app-environment-variables>
    <footer class="stack horizontal justify-between">
      <button
        type="button"
        class="primary"
        [disabled]="form.invalid"
        (click)="save()"
        i18n="@@action.save"
      >
        Save
      </button>
      <button
        type="button"
        class="delete-button"
        (click)="clear()"
        i18n="@@action.clear"
      >
        Clear
      </button>
    </footer>
  </form>
} @else {
  <p i18n="@@message.no_environment_variables">
    No node in this pipeline needs environment variables.
  </p>
}
