<ng-template #confirmEmailTemplate>
  <form
    class="confirmation"
    data-cy="form-login"
    [formGroup]="form"
    (ngSubmit)="login()"
  >
    <header>
      <p i18n="@@message.confirm_email">
        We sent you an email with a special code to be sure you’re the rightful
        account owner. Please check your inbox and enter the code to continue.
      </p>
    </header>
    <fieldset>
      <tui-textfield
        tuiTextfieldSize="s"
        [tuiTextfieldCleaner]="false"
        [invalid]="form.controls.code.touched && form.controls.code.invalid"
      >
        <input
          tuiInput
          id="code"
          name="code"
          formControlName="code"
          placeholder="Code from email"
          i18n-placeholder="@@label.code_from_email"
          type="text"
        />
      </tui-textfield>
    </fieldset>
    <footer>
      <button
        tuiButton
        appearance="outline-grayscale"
        size="s"
        class="fluid"
        [loading]="progress.signup"
        [disabled]="progress.signup"
        data-cy="login-button"
        i18n="@@action.register"
        type="submit"
      >
        Register
      </button>
    </footer>
  </form>
</ng-template>

@if (state.confirm) {
  <app-informer [contentTemplate]="confirmEmailTemplate"></app-informer>
}

@if (!!error) {
  <app-informer [message]="error.message" (ok)="error = null"></app-informer>
}

<div class="app-container">
  <div class="frame">
    <ng-template #selectThemePopover>
      <app-select-theme></app-select-theme>
    </ng-template>
    <div class="frame-actions stack small">
      <button
        tuiIconButton
        appearance="outline-grayscale"
        size="s"
        class="round"
        iconStart="theme"
        aria-label="Theme"
        i18n-aria-label="@@label.theme"
        [appPopover]="{ content: selectThemePopover, trigger: 'click' }"
      ></button>
    </div>

    <div class="stack vertical align-center">
      <img width="60px" height="60px" src="assets/app-logo-square.svg?v=next" />
      <h1 i18n="@@label.register">Register</h1>
    </div>

    <form data-cy="form-login" [formGroup]="form" (ngSubmit)="confirm()">
      <fieldset>
        <tui-textfield
          tuiTextfieldSize="s"
          [tuiTextfieldCleaner]="false"
          [invalid]="form.controls.email.touched && form.controls.email.invalid"
        >
          <input
            tuiInput
            id="email"
            name="email"
            formControlName="email"
            placeholder="Your email"
            i18n-placeholder="@@label.your_email"
            type="text"
          />
        </tui-textfield>
        <tui-textfield
          tuiTextfieldSize="s"
          [tuiTextfieldCleaner]="false"
          [invalid]="form.controls.login.touched && form.controls.login.invalid"
        >
          <input
            tuiInput
            id="login"
            name="login"
            formControlName="login"
            placeholder="Choose a login"
            i18n-placeholder="@@label.choose_login"
            type="text"
          />
        </tui-textfield>
        <tui-textfield
          tuiTextfieldSize="s"
          [tuiTextfieldCleaner]="false"
          [invalid]="
            form.controls.password.touched && form.controls.password.invalid
          "
        >
          <input
            tuiInput
            id="password"
            name="password"
            formControlName="password"
            i18n-placeholder="@@label.password"
            data-cy="password"
            placeholder="Password"
            type="password"
          />
          <tui-icon tuiPassword />
        </tui-textfield>
      </fieldset>
      <fieldset>
        <ng-hcaptcha
          [siteKey]="config.captcha.key"
          formControlName="captcha"
        ></ng-hcaptcha>
      </fieldset>
      <footer>
        <button
          tuiButton
          appearance="outline-grayscale"
          size="s"
          class="fluid"
          [loading]="progress.confirmation"
          [disabled]="progress.confirmation"
          data-cy="login-button"
          i18n="@@action.continue"
          type="submit"
        >
          Continue
        </button>
      </footer>
    </form>

    <div class="stack vertical align-center">
      <div class="stack small align-center">
        <a
          tuiIconButton
          appearance="outline-grayscale"
          size="s"
          class="round"
          href="/oauth/google"
          iconStart="@img.google"
        ></a>
        <a
          tuiIconButton
          appearance="outline-grayscale"
          size="s"
          class="round"
          href="/oauth/yandex"
          iconStart="@img.yandex"
        ></a>
      </div>

      <p i18n="@@message.already_registered">
        Already registered?
        <a [routerLink]="['/login']">Login</a>
      </p>
    </div>
  </div>
</div>
