@if (!!error) {
  <app-informer [message]="error.message" (ok)="error = null"></app-informer>
}

<div class="modal" [class.hidden]="!modal">
  <header>
    <a
      tuiButton
      appearance="outline-grayscale"
      size="s"
      [hotKey]="'escape'"
      (hotKeyPressed)="back()"
      [routerLink]="['./']"
    >
      <app-icon class="icon right" icon="close"></app-icon>
      <span class="badge">ESC</span>
    </a>
  </header>
  <div class="content filled">
    <router-outlet
      (activate)="modal = $event"
      (deactivate)="modal = null"
    ></router-outlet>
  </div>
</div>

<form [formGroup]="form">
  <fieldset>
    <app-json-editor
      [schema]="schemas.pipeline.properties.deploy"
      [disable]="(userRole.admin | can | async) ? [] : ['root.prefix']"
      formControlName="deploy"
    ></app-json-editor>
  </fieldset>
  <footer class="stack">
    <button
      tuiButton
      appearance="outline-grayscale"
      size="s"
      type="button"
      [loading]="progress.deploying"
      [disabled]="progress.deploying"
      (click)="deploy()"
    >
      Deploy
    </button>
  </footer>
</form>

<h2>Current deploys</h2>

<table tuiTable size="m">
  <thead>
    <tr>
      <th tuiTh width="20px"></th>
      <th tuiTh i18n="@@label.deployed_at" width="150px">Deployed at</th>
      <th tuiTh i18n="@@label.slug">Slug</th>
    </tr>
  </thead>
  <tbody>
    @for (d of deploys; track d._id) {
      <tr>
        <td tuiTd>
          <button
            tuiIconButton
            appearance="outline-grayscale"
            size="xs"
            class="round"
            (click)="remove(d)"
            [loading]="progress.removing[d._id]"
            [disabled]="progress.removing[d._id]"
          >
            <app-icon class="icon" icon="delete" [size]="16"></app-icon>
          </button>
        </td>
        <td tuiTd title="Deployed at" i18n-title="@@label.deployed_at">
          {{ d.deployedAt | date: "short" }}
        </td>
        <td tuiTd title="Path" i18n-title="@@label.path">
          <a
            class="default with-icon"
            [routerLink]="!!d.prefix ? [d.prefix, d.slug] : [d.slug]"
          >
            {{ d.prefix ? d.prefix + "/" : "" }}{{ d.slug }}
            <app-icon
              class="icon right"
              icon="open-link"
              [size]="16"
              [stroke]="2"
            ></app-icon>
          </a>
        </td>
      </tr>
    }
    @if (progress.loading) {
      <tr class="loading">
        <td tuiTd colspan="3"><tui-loader [loading]="true" /></td>
      </tr>
    }
  </tbody>
</table>
