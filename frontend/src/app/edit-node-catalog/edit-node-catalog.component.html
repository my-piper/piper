@if (form.errors?.["validate"]; as errors) {
  @for (e of errors; track $index) {
    <tui-error [error]="e" />
  }
}

@if (!!catalogControl.value) {
  <form [formGroup]="form">
    <fieldset>
      <app-json-editor
        [schema]="schemas.node.properties.catalog"
        formControlName="catalog"
      ></app-json-editor>
    </fieldset>
    <footer class="stack justify-between">
      <button
        tuiButton
        appearance="outline-grayscale"
        size="s"
        [loading]="progress.publishing"
        [disabled]="progress.publishing || form.invalid"
        (click)="publish()"
      >
        Publish
      </button>
      <button
        tuiButton
        appearance="outline-destructive"
        size="s"
        (click)="remove()"
      >
        Remove
      </button>
    </footer>
  </form>
} @else {
  <p>You can publish your node to common catalog for reusing.</p>
  <button tuiButton appearance="outline-grayscale" size="s" (click)="create()">
    Create config
  </button>
}
