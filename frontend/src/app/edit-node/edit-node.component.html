<h1>{{ node.title | i18n }}</h1>
@if (node.description; as description) {
  <small>{{ description | i18n }}</small>
}

<header>
  <tui-tabs size="m">
    <a
      tuiTab
      [routerLink]="['./']"
      [routerLinkActiveOptions]="{ exact: true }"
      routerLinkActive
      i18n="@@link.design"
      >Design</a
    >
    <a tuiTab [routerLink]="['script']" routerLinkActive i18n="@@link.script"
      >Script</a
    >
    <a tuiTab [routerLink]="['app']" routerLinkActive i18n="@@link.app">App</a>
    <a tuiTab [routerLink]="['environment']" routerLinkActive
      ><ng-container i18n="@@link.environment">Environment</ng-container></a
    >
    <a tuiTab [routerLink]="['catalog']" routerLinkActive i18n="@@link.catalog"
      >Catalog</a
    >
    <a tuiTab [routerLink]="['yaml']" routerLinkActive i18n="@@link.yaml"
      >YAML</a
    >
  </tui-tabs>
</header>

<div class="child">
  <router-outlet></router-outlet>
</div>
