@if (status?.error; as error) {
  <p class="error">{{ error }}</p>
}

<ul>
  @for (o of node.outputs | keyvalue; track o) {
    <li [attr.data-type]="o.value.type" [class.filled]="outputs?.[o.key]">
      <b>{{ o.value.title | i18n }}</b>
      <app-io-value
        [io]="o.value"
        [value]="$safeNavigationMigration(outputs?.[o.key])"
      ></app-io-value>
    </li>
  }
</ul>
