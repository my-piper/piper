@if (themes.mode$ | async; as current) {
  <tui-segmented [activeItemIndex]="modes.indexOf(current)">
    @for (mode of modes; track mode) {
      <label>
        <input
          type="radio"
          name="theme"
          [value]="mode"
          [checked]="current === mode"
          (change)="themes.setMode(mode)"
        />
        @switch (mode) {
          @case ("light") {
            <ng-container i18n="@@label.theme_light">Light</ng-container>
          }
          @case ("dark") {
            <ng-container i18n="@@label.theme_dark">Dark</ng-container>
          }
          @case ("system") {
            <ng-container i18n="@@label.theme_system">System</ng-container>
          }
        }
      </label>
    }
  </tui-segmented>
}
