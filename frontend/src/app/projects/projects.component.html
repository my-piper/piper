<div class="modal" [class.hidden]="!modal">
  <header>
    <a
      class="primary with-icon"
      [hotKey]="'escape'"
      (hotKeyPressed)="back()"
      [routerLink]="['./']"
      queryParamsHandling="preserve"
    >
      <app-icon class="icon right" icon="close"></app-icon>
      <span class="badge">ESC</span>
    </a>
  </header>
  <div class="content filled">
    <router-outlet
      (activate)="modal = $event"
      (deactivate)="modal = null"
    ></router-outlet>
  </div>
</div>

<ng-template #errorTemplate>
  <div class="informer errors">
    <p>{{ error.message }}</p>
    <ul>
      <li *ngFor="let m of error?.details">{{ m }}</li>
    </ul>
    <div class="stack justify-center">
      <button class="primary" (click)="error = null">Ok</button>
    </div>
  </div>
</ng-template>

<app-informer
  *ngIf="!!error"
  [contentTemplate]="errorTemplate"
  (ok)="error = null"
></app-informer>

<div class="app-container">
  <header class="stack">
    <button
      class="primary with-icon"
      [routerLink]="['add']"
      [class.busy]="progress.creating"
      [disabled]="progress.creating"
      (click)="create()"
    >
      <app-icon class="icon left" icon="add"></app-icon>
      <ng-container i18n="@@action.create">Create</ng-container>
    </button>
    <a
      *ngIf="userRole.admin | can | async"
      class="primary"
      [routerLink]="['import']"
      i18n="@@link.import"
    >
      Import
    </a>
    <form class="search" [formGroup]="form">
      <input
        class="input-primary"
        formControlName="search"
        type="search"
        placeholder="Search"
        i18n-placeholder="@@label.search"
      />
    </form>
  </header>

  <nav class="breadcrumbs" data-testid="projects-breadcrumbs">
    <a
      *ngIf="!!folder; else rootTemplate"
      class="default"
      [routerLink]="[]"
      [queryParams]="{ folder: null }"
      queryParamsHandling="merge"
      i18n="@@link.pipelines"
      >Pipelines</a
    >
    <ng-template #rootTemplate>
      <span i18n="@@link.pipelines">Pipelines</span>
    </ng-template>
    <ng-container *ngIf="!!folder">
      <app-icon class="separator" icon="chevron-right" [size]="14"></app-icon>
      <span class="folder">{{ folder }}</span>
    </ng-container>
  </nav>

  <form *ngIf="allTags.length > 0" class="tags" [formGroup]="form">
    <button
      *ngFor="let t of allTags"
      type="button"
      class="tag"
      formControlName="tags"
      [appSelectable]="{
        value: t,
        group: 'project-tags',
        mode: selectMode.multiple,
      }"
    >
      #{{ t | i18n }}
    </button>
  </form>

  <table class="default">
    <thead>
      <th width="24px"></th>
      <th i18n="@@label.title">Title</th>
      <th width="24px"></th>
      <th width="24px" i18n="@@label.ver">Ver.</th>
      <th width="150px" i18n="@@label.created">Created</th>
      <th width="150px" i18n="@@label.updated">Updated</th>
    </thead>
    <tbody>
      <tr *ngFor="let f of folders" class="folder">
        <td></td>
        <td colspan="5">
          <a
            class="default"
            [routerLink]="[]"
            [queryParams]="{ folder: f }"
            queryParamsHandling="merge"
          >
            {{ f }}
          </a>
        </td>
      </tr>
      <tr *ngFor="let p of projects; let i = index">
        <td>
          <ng-template #actionsTemplate>
            <ul class="context-menu" [class.busy]="progress.deleting">
              <li>
                <button (click)="remove(i, p)">
                  <app-icon
                    class="icon left"
                    icon="delete"
                    [size]="18"
                  ></app-icon>
                  <span i18n="@@action.delete">Delete</span>
                </button>
              </li>
            </ul>
          </ng-template>
          <button
            class="circle"
            [appPopover]="{ content: actionsTemplate, trigger: 'click' }"
            [disabled]="userRole.admin | can: p.createdBy | async | not"
            (attached)="references.popover = $event"
          >
            <app-icon
              class="icon"
              [icon]="
                (userRole.admin | can: p.createdBy | async) ? 'menu' : 'lock'
              "
              [size]="18"
            ></app-icon>
          </button>
        </td>
        <td i18n-title="@@label.title" title="Title" class="title">
          <a
            class="default"
            [routerLink]="[p.slug || p._id]"
            [state]="{ scroll: 'top' }"
          >
            {{ p.title | i18n }}
          </a>

          <div
            *ngIf="(searching && p.group) || p.tags?.length"
            class="row-tags"
          >
            <button
              *ngIf="searching && p.group"
              type="button"
              class="group"
              [class.selected]="folder === p.group"
              (click)="openFolder(p.group)"
            >
              {{ p.group }}
            </button>
            <button
              *ngFor="let t of p.tags"
              type="button"
              class="tag"
              [class.selected]="tagsControl.value?.includes(t)"
              (click)="toggleTag(t)"
            >
              #{{ t | i18n }}
            </button>
          </div>
        </td>
        <td i18n-title="@@label.visibility" title="Visibility">
          <app-icon *ngIf="p.visibility === 'public'" icon="share"></app-icon>
        </td>
        <td class="version">
          {{ p.pipeline.version }}
        </td>
        <td class="created" i18n-title="@@label.created" title="Created">
          <div>{{ p.createdBy?._id }}</div>
          <small>{{ p.createdAt | date }}</small>
        </td>
        <td class="updated" i18n-title="@@label.updated" title="Updated">
          <div>{{ p.updatedBy?._id }}</div>
          <small>{{ p.updatedAt | date: "short" }}</small>
        </td>
      </tr>
      <tr class="loading" *ngIf="progress.loading">
        <td colspan="6"></td>
      </tr>
    </tbody>
  </table>
  <div
    *ngIf="chunk.length > 0 && !progress.loading"
    [inViewport]
    (visible)="loadMore()"
  ></div>
</div>
