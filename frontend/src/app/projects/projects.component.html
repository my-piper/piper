<div class="modal" [class.hidden]="!modal">
  <header>
    <a
      class="primary with-icon"
      [hotKey]="'escape'"
      (hotKeyPressed)="back()"
      [routerLink]="['./']"
      queryParamsHandling="preserve"
    >
      <app-icon class="icon right" icon="close"></app-icon>
      <span class="badge">ESC</span>
    </a>
  </header>
  <div class="content filled">
    <router-outlet
      (activate)="modal = $event"
      (deactivate)="modal = null"
    ></router-outlet>
  </div>
</div>

<ng-template #errorTemplate>
  <div class="informer errors">
    <p>{{ error.message }}</p>
    <ul>
      <li *ngFor="let m of error?.details">{{ m }}</li>
    </ul>
    <div class="stack justify-center">
      <button class="primary" (click)="error = null">Ok</button>
    </div>
  </div>
</ng-template>

<app-informer
  *ngIf="!!error"
  [contentTemplate]="errorTemplate"
  (ok)="error = null"
></app-informer>

<div class="app-container">
  <header class="stack">
    <button
      class="primary with-icon"
      [routerLink]="['add']"
      [class.busy]="progress.creating"
      [disabled]="progress.creating"
      (click)="create()"
    >
      <app-icon class="icon left" icon="add"></app-icon>
      <ng-container i18n="@@action.create">Create</ng-container>
    </button>
    <a
      *ngIf="userRole.admin | can | async"
      class="primary"
      [routerLink]="['import']"
      i18n="@@link.import"
    >
      Import
    </a>
    <form class="search" [formGroup]="form">
      <input
        class="input-primary"
        formControlName="search"
        type="search"
        placeholder="Search"
        i18n-placeholder="@@label.search"
      />
    </form>
  </header>

  <form *ngIf="allTags.length > 0" class="tags" [formGroup]="form">
    <button
      *ngFor="let t of allTags"
      type="button"
      class="tag"
      formControlName="tags"
      [appSelectable]="{
        value: t,
        group: 'project-tags',
        mode: selectMode.multiple,
      }"
    >
      #{{ t | i18n }}
    </button>
  </form>

  <table class="default">
    <thead>
      <th i18n="@@label.title">Title</th>
      <th width="24px"></th>
      <th width="24px" i18n="@@label.ver">Ver.</th>
      <th width="150px" i18n="@@label.created">Created</th>
      <th width="150px" i18n="@@label.updated">Updated</th>
      <th width="24px"></th>
    </thead>
    <ng-template #projectCellsTemplate let-p>
      <td i18n-title="@@label.title" title="Title" class="title tree">
        <div class="tree-label">
          <app-icon class="kind" icon="node" [size]="20"></app-icon>
          <a
            class="default"
            [routerLink]="[p.slug || p._id]"
            [state]="{ scroll: 'top' }"
          >
            {{ p.title | i18n }}
          </a>
        </div>

        <div *ngIf="(searching && p.group) || p.tags?.length" class="row-tags">
          <button
            *ngIf="searching && p.group"
            type="button"
            class="group"
            (click)="revealFolder(p.group)"
          >
            {{ p.group }}
          </button>
          <button
            *ngFor="let t of p.tags"
            type="button"
            class="tag"
            [class.selected]="tagsControl.value?.includes(t)"
            (click)="toggleTag(t)"
          >
            #{{ t | i18n }}
          </button>
        </div>
      </td>
      <td i18n-title="@@label.visibility" title="Visibility">
        <app-icon *ngIf="p.visibility === 'public'" icon="share"></app-icon>
      </td>
      <td class="version">
        {{ p.pipeline.version }}
      </td>
      <td class="created" i18n-title="@@label.created" title="Created">
        <div>{{ p.createdBy?._id }}</div>
        <small>{{ p.createdAt | date }}</small>
      </td>
      <td class="updated" i18n-title="@@label.updated" title="Updated">
        <div>{{ p.updatedBy?._id }}</div>
        <small>{{ p.updatedAt | date: "short" }}</small>
      </td>
      <td class="actions">
        <ng-template #actionsTemplate>
          <ul class="context-menu" [class.busy]="progress.deleting">
            <li>
              <button (click)="remove(p)">
                <app-icon
                  class="icon left"
                  icon="delete"
                  [size]="18"
                ></app-icon>
                <span i18n="@@action.delete">Delete</span>
              </button>
            </li>
          </ul>
        </ng-template>
        <button
          *ngIf="userRole.admin | can: p.createdBy | async"
          class="circle"
          i18n-title="@@action.delete"
          title="Delete"
          [appPopover]="{ content: actionsTemplate, trigger: 'click' }"
          (attached)="references.popover = $event"
        >
          <app-icon class="icon" icon="delete" [size]="18"></app-icon>
        </button>
      </td>
    </ng-template>
    <ng-template #folderTemplate let-f let-depth="depth">
      <!-- the whole row toggles; the button keeps it reachable from the keyboard -->
      <tr
        class="folder"
        [class.expanded]="f.expanded"
        [style.--depth]="depth"
        (click)="toggleFolder(f)"
      >
        <td colspan="6" class="tree">
          <button
            type="button"
            class="folder"
            [attr.aria-expanded]="f.expanded"
          >
            <app-icon
              class="chevron"
              icon="chevron-right"
              [size]="16"
            ></app-icon>
            <span class="name">{{ f.name }}</span>
            <span class="count">{{ f.total }}</span>
          </button>
        </td>
      </tr>
      <ng-container *ngIf="showChildren(f)">
        <ng-container *ngFor="let c of visibleFolders(f.children)">
          <ng-container
            *ngTemplateOutlet="
              folderTemplate;
              context: { $implicit: c, depth: depth + 1 }
            "
          ></ng-container>
        </ng-container>
      </ng-container>
      <ng-container *ngIf="f.expanded">
        <tr
          *ngFor="let p of f.projects"
          class="nested"
          [style.--depth]="depth + 1"
        >
          <ng-container
            *ngTemplateOutlet="projectCellsTemplate; context: { $implicit: p }"
          ></ng-container>
        </tr>
        <tr class="loading" *ngIf="f.loading">
          <td colspan="6"></td>
        </tr>
        <tr
          class="nested more"
          *ngIf="f.more && !f.loading"
          [style.--depth]="depth + 1"
        >
          <td colspan="6" class="tree">
            <button
              type="button"
              class="primary"
              (click)="loadFolder(f)"
              i18n="@@link.more"
            >
              More
            </button>
          </td>
        </tr>
      </ng-container>
    </ng-template>
    <tbody>
      <ng-container *ngFor="let f of folders">
        <ng-container
          *ngTemplateOutlet="
            folderTemplate;
            context: { $implicit: f, depth: 0 }
          "
        ></ng-container>
      </ng-container>
      <tr *ngFor="let p of projects">
        <ng-container
          *ngTemplateOutlet="projectCellsTemplate; context: { $implicit: p }"
        ></ng-container>
      </tr>
      <tr class="loading" *ngIf="progress.loading">
        <td colspan="6"></td>
      </tr>
    </tbody>
  </table>
  <div
    *ngIf="chunk.length > 0 && !progress.loading"
    [inViewport]
    (visible)="loadMore()"
  ></div>
</div>
