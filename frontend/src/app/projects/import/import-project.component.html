@if (error) {
  <div tuiNotification appearance="negative" role="alert" class="error-message">
    <p>{{ error.message }}</p>
    @if (error.details?.length) {
      <ul>
        @for (message of error.details; track $index) {
          <li>{{ message }}</li>
        }
      </ul>
    }
    <button
      tuiButton
      appearance="flat"
      type="button"
      (click)="error = null"
      i18n="@@action.ok"
    >
      Ok
    </button>
  </div>
}

<form [formGroup]="form">
  <fieldset>
    <ngx-monaco-editor
      class="editor"
      formControlName="yaml"
      [options]="{
        language: 'yaml',
      }"
    >
    </ngx-monaco-editor>
  </fieldset>
  <footer>
    <button
      tuiButton
      appearance="flat-grayscale"
      type="button"
      (click)="cancel()"
      i18n="@@action.cancel"
    >
      Cancel
    </button>
    <button
      tuiButton
      type="button"
      [loading]="progress.importing"
      [disabled]="form.invalid || progress.importing"
      (click)="import()"
      i18n="@@action.import"
    >
      Import
    </button>
  </footer>
</form>
