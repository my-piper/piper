<header>
  <div class="actions stack">
    <a
      tuiIconButton
      appearance="outline-grayscale"
      class="round"
      [routerLink]="['..']"
      iconStart="chevron-left"
    ></a>
  </div>
  <div class="title">
    <h1>
      {{ project.title | i18n }}
    </h1>
    @if (project.pipeline.description; as description) {
      <small>{{ description | i18n }}</small>
    }
  </div>
</header>

<div class="project">
  <app-project-playground></app-project-playground>
</div>

<div class="project-playground launches">
  <tui-tabs size="m">
    <a tuiTab [routerLink]="['readme']" routerLinkActive i18n="@@link.readme"
      >README</a
    >
    <a tuiTab [routerLink]="['scheme']" routerLinkActive i18n="@@link.scheme">
      Scheme
    </a>
    <a
      tuiTab
      [routerLink]="['./']"
      [routerLinkActiveOptions]="{ exact: true }"
      routerLinkActive
      i18n="@@link.launches"
      >Launches</a
    >
    <a tuiTab [routerLink]="['comments']" routerLinkActive>
      <ng-container i18n="@@link.comments">Comments</ng-container>
      @if (summary?.comments; as comments) {
        <div tuiBadge appearance="neutral" size="s">
          {{ comments }}
        </div>
      }
    </a>
    @if (project.deploy; as deploy) {
      <a
        tuiTab
        [routerLink]="
          deploy.prefix
            ? ['api', deploy.prefix, deploy.slug]
            : ['api', deploy.slug]
        "
        routerLinkActive
        i18n="@@link.api"
        >API</a
      >
    }
    <a tuiTab [routerLink]="['batches']" routerLinkActive i18n="@@link.batches"
      >Batches</a
    >
  </tui-tabs>
  <div class="child">
    <router-outlet></router-outlet>
  </div>
</div>
