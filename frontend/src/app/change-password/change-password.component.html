@if (!!error) {
  <app-informer [message]="error.message" (ok)="error = null"></app-informer>
}

<form data-cy="form-login" [formGroup]="form" (ngSubmit)="changePassword()">
  <fieldset>
    <div class="field">
      <tui-textfield
        tuiTextfieldSize="s"
        [tuiTextfieldCleaner]="false"
        [invalid]="
          form.controls.password.touched && form.controls.password.invalid
        "
      >
        <input
          tuiInput
          formControlName="password"
          placeholder="Password"
          i18n-placeholder="@@label.password"
          type="password"
        />
        <tui-icon tuiPassword />
      </tui-textfield>
      <tui-error formControlName="password" />
    </div>
    <div class="field">
      <tui-textfield
        tuiTextfieldSize="s"
        [tuiTextfieldCleaner]="false"
        [invalid]="
          form.controls.confirmPassword.touched &&
          form.controls.confirmPassword.invalid
        "
      >
        <input
          tuiInput
          formControlName="confirmPassword"
          placeholder="Confirm password"
          i18n-placeholder="@@label.confirm_password"
          type="password"
        />
        <tui-icon tuiPassword />
      </tui-textfield>
      <tui-error [error]="mismatch ? mismatchError : null" />
    </div>
  </fieldset>
  <footer>
    <button
      tuiButton
      appearance="outline-grayscale"
      size="s"
      class="fluid"
      [loading]="progress.changing"
      [disabled]="progress.changing"
      i18n="@@action.change_password"
      type="submit"
    >
      Change password
    </button>
  </footer>
</form>
