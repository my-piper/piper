@if (!!error) {
  <app-informer [message]="error.message" (ok)="error = null"></app-informer>
}

<ng-template #pipelineTab>
  <div class="editor" [formGroup]="form">
    <ngx-monaco-editor
      class="monaco"
      formControlName="pipeline"
      [options]="{ language: 'yaml' }"
      style="height: 100%"
    >
    </ngx-monaco-editor>
  </div>
</ng-template>

<ng-template #launchRequestTab>
  <div class="editor" [formGroup]="form">
    <ngx-monaco-editor
      class="monaco"
      formControlName="launchRequest"
      [options]="{ language: 'json' }"
    >
    </ngx-monaco-editor>
  </div>
</ng-template>

<ng-template #environmentTab>
  <div class="editor" [formGroup]="form">
    <ngx-monaco-editor
      class="monaco"
      formControlName="environment"
      [options]="{ wordWrap: 'off', language: 'json' }"
    >
    </ngx-monaco-editor>
  </div>
</ng-template>

<form>
  <div class="tabs">
    <tui-tabs size="m" [(activeItemIndex)]="activeTab">
      <button tuiTab type="button">Pipeline</button>
      <button tuiTab type="button">Launch request</button>
      <button tuiTab type="button">Environment</button>
    </tui-tabs>
    <div class="content">
      @switch (activeTab) {
        @case (0) {
          <ng-container *ngTemplateOutlet="pipelineTab"></ng-container>
        }
        @case (1) {
          <ng-container *ngTemplateOutlet="launchRequestTab"></ng-container>
        }
        @case (2) {
          <ng-container *ngTemplateOutlet="environmentTab"></ng-container>
        }
      }
    </div>
  </div>
  <footer>
    <button
      tuiButton
      appearance="outline-grayscale"
      size="s"
      submitButton
      [disabled]="form.invalid"
      (click)="save()"
      i18n="@@action.save"
    >
      Save
    </button>
  </footer>
</form>
