<app-error-dialog [error]="error" (closed)="error = null" />

<ng-container [formGroup]="form">
  <div class="inputs" formGroupName="inputs">
    @for (
      i of project.pipeline.inputs | keyvalue | orderBy: ["value.order"];
      track i
    ) {
      <div>
        <label>
          @if (i.value.icon | piperIcon; as icon) {
            <tui-icon [icon]="icon" class="icon" />
          }
          {{ i.value.title | i18n }}
          @if (i.value.required) {
            <sup>*</sup>
          }
          <ng-template #inputDescriptionPopover>
            <div [innerHTML]="i.value.description | markdown | async"></div>
          </ng-template>
          @if (i.value.description) {
            <button
              tuiIconButton
              appearance="flat-grayscale"
              size="s"
              [tuiHint]="inputDescriptionPopover"
              iconStart="help"
            ></button>
          }
        </label>
        <app-edit-input
          [formControlName]="i.key"
          [label]="i.value.title | i18n"
          [type]="i.value.type"
          [enum]="i.value.enum"
          [freeform]="i.value.freeform"
          [multiline]="i.value.multiline"
          [default]="i.value.default"
          [placeholder]="i.value.placeholder"
          [min]="i.value.min"
          [max]="i.value.max"
          [step]="i.value.step"
          [inputs]="inputsGroup"
        ></app-edit-input>
      </div>
    }
  </div>
</ng-container>

<footer class="stack space-between">
  <button
    tuiButton
    appearance="outline-grayscale"
    size="m"
    class="fluid"
    [loading]="progress.launching"
    [disabled]="!form.valid || progress.launching"
    (click)="launch()"
  >
    <div class="stack small align-center">
      <ng-container i18n="@@action.run">Run</ng-container>
    </div>
  </button>

  <ng-template #toolsMenu>
    <tui-data-list>
      <button tuiOption type="button" (click)="reset()">
        <tui-icon icon="@tui.x" />
        <ng-container i18n="@@action.reset">Reset</ng-container>
      </button>
    </tui-data-list>
  </ng-template>

  <button
    tuiIconButton
    appearance="primary"
    size="m"
    type="button"
    iconStart="@tui.ellipsis-vertical"
    aria-label="Actions"
    i18n-aria-label="@@label.actions"
    [tuiDropdown]="toolsMenu"
    [(tuiDropdownOpen)]="toolsOpen"
  ></button>
</footer>
