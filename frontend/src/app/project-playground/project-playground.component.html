<ng-template #errorTemplate>
  <div class="informer errors">
    <p>{{ error.message }}</p>
    <ul>
      @for (m of error?.details; track $index) {
        <li>{{ m }}</li>
      }
    </ul>
    <div class="stack justify-center">
      <button class="primary" (click)="error = null">Ok</button>
    </div>
  </div>
</ng-template>

@if (!!error) {
  <app-informer
    [contentTemplate]="errorTemplate"
    (ok)="error = null"
  ></app-informer>
}

<ng-container [formGroup]="form">
  <div class="inputs" formGroupName="inputs">
    @for (
      i of project.pipeline.inputs | keyvalue | orderBy: ["value.order"];
      track i
    ) {
      <div>
        <label>
          @if (i.value.icon; as icon) {
            <app-icon class="icon" [icon]="icon"></app-icon>
          }
          {{ i.value.title | i18n }}<sup>{{ i.value.required ? "*" : "" }}</sup>
          <ng-template #inputDescriptionPopover>
            <div [innerHTML]="i.value.description | markdown | async"></div>
          </ng-template>
          @if (i.value.description) {
            <button
              class="transparent"
              [appPopover]="{ content: inputDescriptionPopover }"
            >
              <app-icon class="icon" icon="help"></app-icon>
            </button>
          }
        </label>
        <app-edit-input
          [formControlName]="i.key"
          [id]="i.key"
          [type]="i.value.type"
          [enum]="i.value.enum"
          [freeform]="i.value.freeform"
          [multiline]="i.value.multiline"
          [default]="i.value.default"
          [placeholder]="i.value.placeholder"
          [min]="i.value.min"
          [max]="i.value.max"
          [step]="i.value.step"
          [inputs]="inputsGroup"
        ></app-edit-input>
      </div>
    }
  </div>
</ng-container>

<footer class="stack space-between">
  <button
    class="primary fluid"
    [class.busy]="progress.launching"
    [disabled]="!form.valid || progress.launching"
    (click)="launch()"
  >
    <div class="stack small align-center">
      <ng-container i18n="@@action.run">Run</ng-container>
    </div>
  </button>

  <ng-template #toolsPopover>
    <ul class="context-menu">
      <li>
        <button (click)="reset()">
          <app-icon class="icon" icon="close"></app-icon>
          <ng-container i18n="@@action.reset">Reset</ng-container>
        </button>
      </li>
    </ul>
  </ng-template>

  <button
    class="primary with-icon only-icon"
    [appPopover]="{ content: toolsPopover, trigger: 'click' }"
    (attached)="references.popover = $event"
  >
    <app-icon class="icon" icon="menu"></app-icon>
  </button>
</footer>
