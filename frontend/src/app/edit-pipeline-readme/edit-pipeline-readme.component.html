<div class="modal" [class.hidden]="!modal">
  <header>
    <a
      tuiButton
      appearance="outline-grayscale"
      size="s"
      [hotKey]="'escape'"
      (hotKeyPressed)="back()"
      [routerLink]="['./']"
    >
      <app-icon class="icon right" icon="close"></app-icon>
      <span class="badge">ESC</span>
    </a>
  </header>
  <div class="content filled">
    <router-outlet
      (activate)="modal = $event"
      (deactivate)="modal = null"
    ></router-outlet>
  </div>
</div>

<form [formGroup]="form">
  <div class="editor">
    <ngx-monaco-editor
      class="monaco"
      formControlName="readme"
      [options]="{ wordWrap: 'off', language: 'markdown' }"
    >
    </ngx-monaco-editor>
  </div>
  <footer class="stack">
    <a tuiButton appearance="outline-grayscale" size="s" [routerLink]="['view']"
      >View</a
    >
    <button
      tuiButton
      appearance="outline-grayscale"
      size="s"
      submitButton
      [disabled]="form.invalid"
      (click)="save()"
    >
      Save
    </button>
  </footer>
</form>
