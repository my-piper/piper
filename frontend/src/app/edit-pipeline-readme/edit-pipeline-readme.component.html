<div class="modal" [class.hidden]="!modal">
  <header>
    <a
      tuiButton
      appearance="outline-grayscale"
      [hotKey]="'escape'"
      (hotKeyPressed)="back()"
      [routerLink]="['./']"
    >
      <tui-icon icon="close" class="icon right" />
      <span tuiBadge appearance="neutral" size="s">ESC</span>
    </a>
  </header>
  <div class="content filled">
    <router-outlet
      (activate)="modal = $event"
      (deactivate)="modal = null"
    ></router-outlet>
  </div>
</div>

<form [formGroup]="form">
  <div class="editor">
    <ngx-monaco-editor
      class="monaco"
      formControlName="readme"
      [options]="{ wordWrap: 'off', language: 'markdown' }"
    >
    </ngx-monaco-editor>
  </div>
  <footer class="stack">
    <a tuiButton appearance="outline-grayscale" [routerLink]="['view']">View</a>
    <button
      tuiButton
      appearance="outline-grayscale"
      submitButton
      [disabled]="form.invalid"
      (click)="save()"
    >
      Save
    </button>
  </footer>
</form>
