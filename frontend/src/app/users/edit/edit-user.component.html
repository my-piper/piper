<app-error-dialog [error]="error" (closed)="error = null" />

<form [formGroup]="form" (ngSubmit)="save()">
  <fieldset>
    <app-json-editor
      [schema]="schemas.user"
      [disable]="!!user ? ['root._id'] : []"
      [features]="[]"
      formControlName="user"
    ></app-json-editor>
  </fieldset>
  <footer>
    <button
      tuiButton
      appearance="flat-grayscale"
      type="button"
      (click)="cancel()"
      i18n="@@action.cancel"
    >
      Cancel
    </button>
    <button
      tuiButton
      [loading]="progress.saving"
      [disabled]="!form.valid || progress.saving"
      type="submit"
      i18n="@@action.save"
    >
      Save
    </button>
  </footer>
</form>
