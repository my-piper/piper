<ng-template #errorTemplate>
  <div class="informer errors">
    <p>{{ error.message }}</p>
    <ul>
      @for (m of error?.details; track $index) {
        <li>{{ m }}</li>
      }
    </ul>
    <div class="stack justify-center">
      <button class="primary" (click)="error = null">Ok</button>
    </div>
  </div>
</ng-template>

@if (!!error) {
  <app-informer
    [contentTemplate]="errorTemplate"
    (ok)="error = null"
  ></app-informer>
}

@if (!!user) {
  <h1>{{ user._id }}</h1>
} @else {
  <h1>Add user</h1>
}

<form [formGroup]="form" (ngSubmit)="save()">
  <fieldset>
    <app-json-editor
      [schema]="schemas.user"
      [disable]="!!user ? ['root._id'] : []"
      [features]="[]"
      formControlName="user"
    ></app-json-editor>
  </fieldset>
  <footer>
    <button
      class="primary"
      [class.busy]="progress.saving"
      [disabled]="!form.valid || progress.saving"
      type="submit"
      i18n="@@action.save"
    >
      Save
    </button>
  </footer>
</form>
