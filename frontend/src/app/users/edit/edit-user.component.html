<app-error-dialog [error]="error" (closed)="error = null" />

@if (!!user) {
  <h1>{{ user._id }}</h1>
} @else {
  <h1>Add user</h1>
}

<form [formGroup]="form" (ngSubmit)="save()">
  <fieldset>
    <app-json-editor
      [schema]="schemas.user"
      [disable]="!!user ? ['root._id'] : []"
      [features]="[]"
      formControlName="user"
    ></app-json-editor>
  </fieldset>
  <footer>
    <button
      tuiButton
      appearance="outline-grayscale"
      [loading]="progress.saving"
      [disabled]="!form.valid || progress.saving"
      type="submit"
      i18n="@@action.save"
    >
      Save
    </button>
  </footer>
</form>
