@if (project.pipeline.tags; as tags) {
  <ul class="tags">
    @for (t of tags; track t) {
      <li>
        @if (t | i18n; as tag) {
          <a [routerLink]="['../..', { tag }]">#{{ tag }}</a>
        }
      </li>
    }
  </ul>
}

@if (project?.pipeline?.readme; as readme) {
  <div [innerHTML]="readme | markdown | async"></div>
}
