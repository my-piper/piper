@if (project.pipeline.tags?.length) {
  <div class="tags">
    @for (t of project.pipeline.tags; track t) {
      @if (t) {
        <a
          tuiChip
          size="xs"
          appearance="neutral"
          routerLink="/projects"
          [queryParams]="{ tag: t }"
        >
          #{{ t | i18n }}
        </a>
      }
    }
  </div>
}

@if (project?.pipeline?.readme; as readme) {
  <div [innerHTML]="readme | markdown | async"></div>
}
