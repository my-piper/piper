@switch (type) {
  @case ("image") {
    <img imageFallback [src]="url" />
  }
  @case ("video") {
    <video [src]="url" autoplay muted controls></video>
  }
  @case ("markdown") {
    <div [innerHTML]="text | markdown | async"></div>
  }
  @case ("json") {
    <ngx-monaco-editor
      class="monaco"
      [options]="{
        readOnly: true,
        automaticLayout: true,
      }"
      [model]="{ language: 'json', value: text }"
    >
    </ngx-monaco-editor>
  }
}
