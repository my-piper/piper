<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Piper — Pipelines Builder</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=next" />

    <script>
      (function () {
        var mode = localStorage.getItem("theme");
        var light =
          mode === "light" ||
          (mode !== "dark" &&
            matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>

    <script>
      const PRERENDER = {};
      localStorage.setItem("prerender", JSON.stringify(PRERENDER));
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
