@switch (type) {
  @case ("cards") {
    <div
      class="cards"
      [style.grid-template-columns]="'repeat(' + cols + ', 1fr)'"
    >
      @for (l of cols * rows | mockArray; track l) {
        <div></div>
      }
    </div>
  }
  @default {
    <div class="lines">
      @for (l of lines | mockArray; track l) {
        <div></div>
      }
    </div>
  }
}
