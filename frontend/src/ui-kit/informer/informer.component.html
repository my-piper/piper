<ng-container
  *ngTemplateOutlet="contentTemplate || defaultContentTemplate"
></ng-container>

<ng-template #defaultContentTemplate>
  <p>{{ message }}</p>
  <button
    tuiButton
    appearance="outline-grayscale"
    size="s"
    #okRef
    (click)="ok.emit()"
  >
    OK
  </button>
</ng-template>
