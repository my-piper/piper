name: build

on: [pull_request, push]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Check Node version pins match .nvmrc
        run: ../tools/check-node-version.sh

      - name: Install backend dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Check install scripts are approved
        run: ../tools/check-install-scripts.sh .

      - name: Typecheck tests
        run: npm run test:typecheck

      - name: Lint
        run: npm run lint

      - name: Run fast tests with coverage
        run: npm run test:coverage

      - name: Run infrastructure and end-to-end Deno tests
        run: npm run test:integration
        timeout-minutes: 8

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

  frontend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check install scripts are approved
        run: ../tools/check-install-scripts.sh .

      # Used by both the Vitest fast suites (browser mode) and the Playwright workflows.
      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Check removed test dependencies stay removed
        run: scripts/check-denied-deps.mjs

      - name: Typecheck tests
        run: |
          npm run test:typecheck
          npm run test:browser:typecheck

      - name: Lint
        run: npm run lint

      - name: Check i18n extraction
        run: npm run i18n:check

      - name: Typecheck templates
        run: npm run typecheck:templates

      - name: Run fast tests with coverage
        run: npm run test:coverage
        timeout-minutes: 10

      - name: Run browser workflows
        run: npm run test:browser
        timeout-minutes: 15
        env:
          CI: "true"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
            frontend/.vitest/attachments
          retention-days: 7
          if-no-files-found: ignore

  build:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Read Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,priority=300
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/docker/Dockerfile
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:_buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:_buildcache,mode=max

      # npm 11 skips install scripts missing from allowScripts, which leaves a
      # native module without its binary while the image still builds (#105).
      # Also checks the esbuild binary that tsx (and so the backend) runs on.
      - name: Smoke-test native modules
        run: >
          docker run --rm --entrypoint node -w /app/backend
          ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          -e "require('bcrypt'); require('sharp'); require('msgpackr-extract'); require('jsonwebtoken');
          require(require.resolve('esbuild', { paths: ['node_modules/tsx'] })).transformSync('');"

      # Same inputs on the same builder: every layer comes from the cache of
      # the step above, so this only exports and pushes.
      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/docker/Dockerfile
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:_buildcache
